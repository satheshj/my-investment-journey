name: Refresh Indian and global market notes

on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-global-market-notes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh Indian and global market notes
        run: npm run global-markets:refresh

      - name: Verify generated site
        run: npm run check

      - name: Publish refreshed edition
        run: |
          if git diff --quiet -- src/data/global-markets/weekly-digest.json; then
            echo "No digest changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/global-markets/weekly-digest.json
          git commit -m "chore: refresh Indian and global market notes"
          git push
