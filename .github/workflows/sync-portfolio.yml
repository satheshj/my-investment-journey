name: Sync portfolio from Google Drive

on:
  schedule:
    - cron: "47 3,12 5 * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-portfolio
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Generate public allocation
        env:
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: npm run portfolio:sync-drive

      - name: Verify generated site
        run: npm run check

      - name: Publish public artifacts
        run: |
          if git diff --quiet -- src/data/portfolio/instruments.json src/data/portfolio/published-allocation.json; then
            echo "No portfolio changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/portfolio/instruments.json src/data/portfolio/published-allocation.json
          git commit -m "chore: sync public portfolio allocation"
          git push
